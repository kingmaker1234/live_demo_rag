services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dual_rag_backend
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
      - ./backend/storage:/app/backend/storage
      - hf_cache:/app/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5); assert r.status == 200"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: dual_rag_streamlit
    env_file:
      - .env
    environment:
      - API_BASE_URL=http://backend:8000
      - PYTHONUNBUFFERED=1
    command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.port", "8501", "--server.address", "0.0.0.0"]
    ports:
      - "8501:8501"
    volumes:
      - ./data:/app/data
      - ./backend/storage:/app/backend/storage
      - hf_cache:/app/.cache/huggingface
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  hf_cache: